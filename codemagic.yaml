workflows:
  android-debug:
    name: F1 MultiView Debug APK
    max_build_duration: 60
    scripts:
      - name: Configure Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Assemble debug
        script: chmod +x ./gradlew && set -o pipefail && ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - build-debug.log
  android-release:
    name: F1 MultiView Release APK
    max_build_duration: 60
    scripts:
      - name: Configure Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Assemble release APK
        script: chmod +x ./gradlew && ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
