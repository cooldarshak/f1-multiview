workflows:
  android-debug:
    name: F1 MultiView Signed APK
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      android_signing:
        - f1-multiview-release
    scripts:
      - name: Configure Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Assemble signed APK
        script: export CM_VERSION_CODE=$(date +%s) && chmod +x ./gradlew && set -o pipefail && ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log; rc=${PIPESTATUS[0]}; if [ "$rc" -ne 0 ]; then echo "===== GRADLE FAILURE ====="; tail -n 250 build-release.log; fi; exit "$rc"
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - build-release.log
  android-release:
    name: F1 MultiView Signed APK
    max_build_duration: 60
    environment:
      android_signing:
        - f1-multiview-release
    scripts:
      - name: Configure Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Assemble release APK
        script: export CM_VERSION_CODE=$(date +%s) && chmod +x ./gradlew && ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk

