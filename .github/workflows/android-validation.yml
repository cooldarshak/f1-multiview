name: Android validation

on:
  push:
    branches:
      - feature/android-tv-remote
      - feature/tiledmedia-multiview-rearchitecture

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Media3 source
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: 8c6678b657ede1e7883fc164ef73ed483c7796c3
          path: media3-source
          fetch-depth: 1

      - name: Apply and verify Media3 request-role patch
        run: |
          set -euo pipefail
          cd media3-source
          test "$(git rev-parse HEAD)" = "8c6678b657ede1e7883fc164ef73ed483c7796c3"
          git apply --check ../patches/media3/0001-explicit-media-segment-role.patch
          git apply ../patches/media3/0001-explicit-media-segment-role.patch
          test "$(grep -Fc 'setCustomData("f1-multiview:media-segment:v1")' libraries/exoplayer_dash/src/main/java/androidx/media3/exoplayer/dash/DefaultDashChunkSource.java)" -eq 2

      - name: Stage and verify pinned encrypted CMAF fixture
        run: |
          set -euo pipefail
          FIXTURE="media3-source/libraries/test_data/src/test/assets/media/drm/sample_fragmented_widevine.mp4"
          test -s "$FIXTURE"
          test "$(git -C media3-source hash-object "$FIXTURE")" = "942694cfcc66632973689c4d46a8f94794ba510b"
          mkdir -p app/src/test/resources/media
          cp "$FIXTURE" app/src/test/resources/media/sample_fragmented_widevine.mp4
          test -s app/src/test/resources/media/sample_fragmented_widevine.mp4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Publish patched Media3 HLS and DASH to local Maven
        working-directory: media3-source
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :lib-exoplayer-hls:publishToMavenLocal :lib-exoplayer-dash:publishToMavenLocal

      - name: Kotlin and unit-test gate
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest -PusePinnedMedia3Source=true

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug -PusePinnedMedia3Source=true
          test -s app/build/outputs/apk/debug/app-debug.apk
