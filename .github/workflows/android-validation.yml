name: Android validation

on:
  push:
    branches:
      - feature/android-tv-remote
      - feature/tiledmedia-multiview-rearchitecture

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GPAC_ROOT: ${{ github.workspace }}/.native/gpac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep Gradle dependencies/build state warm across validation runs. The
      # fast Kotlin/unit-test gate below deliberately runs before the expensive
      # native GPAC build so a test compile failure consumes seconds, not minutes.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fast Kotlin and unit-test gate
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Install GPAC and FFmpeg for TME smoke test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ffmpeg build-essential cmake unzip
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://dist.gpac.io/gpac/linux/gpg.asc | sudo gpg --dearmor -o /etc/apt/keyrings/gpac.gpg
          sudo chmod a+r /etc/apt/keyrings/gpac.gpg
          . /etc/os-release
          CODENAME="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
          printf 'Types: deb\nURIs: https://dist.gpac.io/gpac/linux/ubuntu\nSuites: %s\nComponents: nightly\nSigned-By: /etc/apt/keyrings/gpac.gpg\n' "$CODENAME" | sudo tee /etc/apt/sources.list.d/gpac.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y gpac
          rm -rf /tmp/kvazaar
          git clone --depth 1 --branch v2.3.2 https://github.com/ultravideo/kvazaar.git /tmp/kvazaar
          cmake -S /tmp/kvazaar -B /tmp/kvazaar/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build /tmp/kvazaar/build --parallel 2
          sudo cmake --install /tmp/kvazaar/build
          sudo ldconfig

      - name: Run TME compressed-domain smoke test
        run: |
          set -euo pipefail
          chmod +x ./scripts/tme-gpac-smoke.sh
          ./scripts/tme-gpac-smoke.sh

      - name: Build GPAC ARM64 native TME dependency
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          chmod +x ./scripts/build-gpac-android.sh
          ./scripts/build-gpac-android.sh "$GPAC_ROOT"

      - name: Verify GPAC native inputs
        run: |
          set -euo pipefail
          test -f "$GPAC_ROOT/include/gpac/filters.h"
          test -f "$GPAC_ROOT/lib/libgpac.a"
          test -f "/tmp/gpac-v26.07.0-tme/src/filters/hevcmerge.c"
          test -f "/tmp/gpac-v26.07.0-tme/src/filters/hevcsplit.c"
          echo "GPAC_SOURCE_PIN=v26.07.0"
          echo "GPAC_TME_FILTERS=hevcmerge,hevcsplit"
          echo "GPAC_ARM64_NATIVE_BUILD=READY"

      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Verify native TME library is packaged
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libf1tme.so'
          unzip -p "$APK" 'lib/arm64-v8a/libf1tme.so' > /tmp/libf1tme.so
          file /tmp/libf1tme.so
          readelf -h /tmp/libf1tme.so | grep 'AArch64'
