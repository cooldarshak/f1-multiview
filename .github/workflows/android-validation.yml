name: Android validation

on:
  push:
    branches:
      - feature/android-tv-remote
      - feature/tiledmedia-multiview-rearchitecture

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Install GPAC and FFmpeg for TME smoke test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ffmpeg build-essential cmake
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://dist.gpac.io/gpac/linux/gpg.asc | sudo gpg --dearmor -o /etc/apt/keyrings/gpac.gpg
          sudo chmod a+r /etc/apt/keyrings/gpac.gpg
          . /etc/os-release
          CODENAME="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
          printf 'Types: deb\nURIs: https://dist.gpac.io/gpac/linux/ubuntu\nSuites: %s\nComponents: nightly\nSigned-By: /etc/apt/keyrings/gpac.gpg\n' "$CODENAME" | sudo tee /etc/apt/sources.list.d/gpac.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y gpac
          rm -rf /tmp/kvazaar
          git clone --depth 1 --branch v2.3.2 https://github.com/ultravideo/kvazaar.git /tmp/kvazaar
          cmake -S /tmp/kvazaar -B /tmp/kvazaar/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build /tmp/kvazaar/build --parallel 2
          sudo cmake --install /tmp/kvazaar/build
          sudo ldconfig

      - name: Run TME compressed-domain smoke test
        run: |
          chmod +x ./scripts/tme-gpac-smoke.sh
          ./scripts/tme-gpac-smoke.sh

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
