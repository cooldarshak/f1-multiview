name: Android validation

on:
  push:
    branches:
      - feature/android-tv-remote
      - feature/tiledmedia-multiview-rearchitecture

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install GPAC and FFmpeg for TME smoke test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ffmpeg build-essential cmake unzip
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://dist.gpac.io/gpac/linux/gpg.asc | sudo gpg --dearmor -o /etc/apt/keyrings/gpac.gpg
          sudo chmod a+r /etc/apt/keyrings/gpac.gpg
          . /etc/os-release
          CODENAME="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
          printf 'Types: deb\nURIs: https://dist.gpac.io/gpac/linux/ubuntu\nSuites: %s\nComponents: nightly\nSigned-By: /etc/apt/keyrings/gpac.gpg\n' "$CODENAME" | sudo tee /etc/apt/sources.list.d/gpac.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y gpac
          rm -rf /tmp/kvazaar
          git clone --depth 1 --branch v2.3.2 https://github.com/ultravideo/kvazaar.git /tmp/kvazaar
          cmake -S /tmp/kvazaar -B /tmp/kvazaar/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build /tmp/kvazaar/build --parallel 2
          sudo cmake --install /tmp/kvazaar/build
          sudo ldconfig

      - name: Run TME compressed-domain smoke test
        run: |
          chmod +x ./scripts/tme-gpac-smoke.sh
          ./scripts/tme-gpac-smoke.sh

      - name: Build GPAC ARM64 native TME runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/gpac-src /tmp/gpac-sdk
          git clone --depth 1 --branch v26.07.0 https://github.com/gpac/gpac.git /tmp/gpac-src
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"
          cd /tmp/gpac-src
          python3 -c 'from pathlib import Path; p=Path("configure"); s=p.read_text(); a=s.index("#check dlopen support"); b=s.index("#check st_mtim.tv_nsec support"); p.write_text(s[:a] + "#check dlopen support\\nhas_dlopen=\"yes\"\\n" + s[b:])'
          ./configure \
            --target-os=android \
            --cpu=aarch64 \
            --cc="$TOOLCHAIN/aarch64-linux-android28-clang" \
            --cxx="$TOOLCHAIN/aarch64-linux-android28-clang++" \
            --prefix=/tmp/gpac-sdk \
            --disable-all \
            --enable-threads \
            --disable-dvbx \
            --enable-isoff \
            --enable-isoff-write \
            --enable-isoff-frag \
            --enable-hevcmerge \
            --enable-hevcsplit \
            --enable-tileagg \
            --enable-tilesplit \
            --enable-fin \
            --enable-fout \
            --enable-pin \
            --enable-pout \
            --enable-mp4dmx \
            --enable-mp4mx \
            --static-modules \
            --use-zlib=no \
            --use-ffmpeg=no \
            --use-ssl=no \
            --use-nghttp2=no \
            --use-ngtcp2=no \
            --use-nghttp3=no \
            --use-curl=no \
            --disable-qjs \
            --disable-qjs-libc \
            --disable-network \
            --disable-compositor \
            --disable-vout \
            --disable-aout \
            --disable-fonts
          make -j2
          make install
          test -f /tmp/gpac-sdk/lib/libgpac.so
          mkdir -p "$GITHUB_WORKSPACE/app/build/gpac-jni/arm64-v8a"
          cp -a /tmp/gpac-sdk/lib/libgpac.so "$GITHUB_WORKSPACE/app/build/gpac-jni/arm64-v8a/"
          mkdir -p "$GITHUB_WORKSPACE/app/build/gpac-headers"
          cp -a /tmp/gpac-sdk/include "$GITHUB_WORKSPACE/app/build/gpac-headers/"
          echo "GPAC_ROOT=/tmp/gpac-sdk" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
