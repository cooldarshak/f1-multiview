name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-latest

    env:
      CM_KEYSTORE_PATH: ${{ github.workspace }}/signing/f1-multiview.keystore
      CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "${CM_KEYSTORE_PATH%/*}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CM_KEYSTORE_PATH"
          test -s "$CM_KEYSTORE_PATH"

      - name: Assemble signed debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          UPDATED_VERSION_CODE=$((1000 + VERSION_CODE))
          ./gradlew assembleDebug \
            -PversionCode="$UPDATED_VERSION_CODE" \
            -PversionName="1.1.$UPDATED_VERSION_CODE"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "APK signing certificate:"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: f1-multiview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14