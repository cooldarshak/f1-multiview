name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-latest

    env:
      CM_KEYSTORE_PATH: ${{ github.workspace }}/signing/f1-multiview.keystore
      CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "${CM_KEYSTORE_PATH%/*}"
          CLEAN_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          test -n "$CLEAN_BASE64"
          printf '%s' "$CLEAN_BASE64" | base64 --decode --ignore-garbage > "$CM_KEYSTORE_PATH"
          test -s "$CM_KEYSTORE_PATH"
          keytool -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" >/dev/null

      - name: Determine canonical build version
        id: version
        run: |
          set -euo pipefail
          VERSION_CODE="$(bash scripts/ci-version-code.sh)"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Canonical versionCode=$VERSION_CODE"

      - name: Clean build outputs
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/apk artifacts
          mkdir -p artifacts

      - name: Assemble signed debug APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug             -PversionCode="${{ steps.version.outputs.version_code }}"             -PversionName="1.1.${{ steps.version.outputs.version_code }}"

      - name: Verify and stage canonical APK
        env:
          CM_KEYSTORE_PATH: ${{ env.CM_KEYSTORE_PATH }}
          CM_KEYSTORE_PASSWORD: ${{ env.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ env.CM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          cp "$APK" artifacts/f1-multiview-debug.apk
          bash scripts/verify-apk.sh artifacts/f1-multiview-debug.apk

      - name: Upload canonical signed APK
        uses: actions/upload-artifact@v4
        with:
          name: f1-multiview-debug-apk
          path: artifacts/f1-multiview-debug.apk
          if-no-files-found: error
          retention-days: 14

  cloud-test:
    name: Cloud Android smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed debug APK
        uses: actions/download-artifact@v4
        with:
          name: f1-multiview-debug-apk
          path: artifacts

      - name: Prepare test artifacts
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          test -s artifacts/f1-multiview-debug.apk

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/cloud-smoke-test.sh

      - name: Upload cloud smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cloud-smoke-test
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
