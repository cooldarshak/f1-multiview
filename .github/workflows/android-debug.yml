name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tiledmedia-multiview-rearchitecture

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-latest

    env:
      CM_KEYSTORE_PATH: ${{ github.workspace }}/signing/f1-multiview.keystore
      CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Media3 source
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: 8c6678b657ede1e7883fc164ef73ed483c7796c3
          path: media3-source
          fetch-depth: 1

      - name: Apply and verify Media3 request-role patch
        run: |
          set -euo pipefail
          cd media3-source
          test "$(git rev-parse HEAD)" = "8c6678b657ede1e7883fc164ef73ed483c7796c3"
          git apply --check ../patches/media3/0001-explicit-media-segment-role.patch
          git apply ../patches/media3/0001-explicit-media-segment-role.patch
          test "$(grep -Fc 'setCustomData("f1-multiview:media-segment:v1")' libraries/exoplayer_dash/src/main/java/androidx/media3/exoplayer/dash/DefaultDashChunkSource.java)" -eq 2

      - name: Stage and verify pinned encrypted CMAF fixture
        run: |
          set -euo pipefail
          FIXTURE="media3-source/sample_fragmented_widevine.mp4"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/androidx/media/8c6678b657ede1e7883fc164ef73ed483c7796c3/libraries/test_data/src/test/assets/media/drm/sample_fragmented_widevine.mp4" \
            --output "$FIXTURE"
          test -s "$FIXTURE"
          test "$(git -C media3-source hash-object sample_fragmented_widevine.mp4)" = "942694cfcc66632973689c4d46a8f94794ba510b"
          mkdir -p app/src/test/resources/media
          cp "$FIXTURE" app/src/test/resources/media/sample_fragmented_widevine.mp4
          test -s app/src/test/resources/media/sample_fragmented_widevine.mp4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Publish patched Media3 HLS and DASH to local Maven
        working-directory: media3-source
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :lib-exoplayer-hls:publishToMavenLocal :lib-exoplayer-dash:publishToMavenLocal

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "${CM_KEYSTORE_PATH%/*}"
          CLEAN_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          test -n "$CLEAN_BASE64"
          printf '%s' "$CLEAN_BASE64" | base64 --decode --ignore-garbage > "$CM_KEYSTORE_PATH"
          test -s "$CM_KEYSTORE_PATH"
          keytool -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" >/dev/null

      - name: Determine canonical build version
        id: version
        run: |
          set -euo pipefail
          VERSION_CODE="$(bash scripts/ci-version-code.sh)"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Canonical versionCode=$VERSION_CODE"

      - name: Clean build outputs
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/apk artifacts
          mkdir -p artifacts

      - name: Assemble signed debug APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug             -PversionCode="${{ steps.version.outputs.version_code }}"             -PversionName="1.1.${{ steps.version.outputs.version_code }}" -PusePinnedMedia3Source=true

      - name: Verify and stage canonical APK
        env:
          CM_KEYSTORE_PATH: ${{ env.CM_KEYSTORE_PATH }}
          CM_KEYSTORE_PASSWORD: ${{ env.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ env.CM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          cp "$APK" artifacts/f1-multiview-debug.apk
          bash scripts/verify-apk.sh artifacts/f1-multiview-debug.apk

      - name: Upload canonical signed APK
        uses: actions/upload-artifact@v4
        with:
          name: f1-multiview-debug-apk
          path: artifacts/f1-multiview-debug.apk
          if-no-files-found: error
          retention-days: 14
